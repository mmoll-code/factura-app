services:
  backend:
    build: .
    container_name: facturas-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - webnet
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379" 
    networks:
      - webnet

  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Para los certificados SSL
    depends_on:
      - backend
    networks:
      - webnet

networks:
  webnet:
